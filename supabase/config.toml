# The handler authenticates the caller itself with authenticatedUser(); platform
# JWT verification is off so the browser CORS preflight is not rejected.
[functions.mpesa-stk]
verify_jwt = false

# Daraja cannot attach a Supabase JWT to its callback. The handler validates the
# DARAJA_CALLBACK_TOKEN query parameter instead.
[functions.mpesa-callback]
verify_jwt = false

# The handler authenticates the caller itself with authenticatedUser().
[functions.send-sms]
verify_jwt = false

# Password reset is protected by phone-bound, expiring one-time codes.
[functions.password-reset]
verify_jwt = false

# Invoke this only from a trusted scheduler with the CRON_SECRET header.
[functions.debt-reminders]
verify_jwt = false
